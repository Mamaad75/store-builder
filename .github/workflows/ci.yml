# Initial CI (CI-0). Verification only: no deployment, no secrets, no external infrastructure.
# Everything runs on GitHub-hosted runners against job-local, throw-away PostgreSQL containers.
# The only network access is fetching public dependencies (npm registry, Docker Hub images, Playwright browser).
# Storage tests use a throw-away MinIO container with test-only credentials and an isolated bucket.
name: CI

on:
  push:
    branches: [claude/confident-davinci-mcf5d0]
  pull_request:
  workflow_dispatch:

# Least privilege: the default token may only read the repository contents.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: "true"
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  static:
    name: Typecheck, lint, unit tests, build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The pnpm version comes from "packageManager" in package.json.
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - run: pnpm typecheck
      - run: pnpm lint
      - name: Unit tests
        run: pnpm test
      - name: Production build
        run: pnpm build

  database:
    name: Database tests (PostgreSQL 16)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: storebuilder
          POSTGRES_PASSWORD: storebuilder # throw-away value for this job's own container only
          POSTGRES_DB: storebuilder
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U storebuilder"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # The test setup creates and drops its own isolated "storebuilder_test" database and refuses any other name.
      DATABASE_URL: postgresql://storebuilder:storebuilder@localhost:5432/storebuilder
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - name: Database tests
        run: pnpm test:db

  storage:
    name: Storage tests (MinIO + PostgreSQL 16)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: storebuilder
          POSTGRES_PASSWORD: storebuilder # throw-away value for this job's own container only
          POSTGRES_DB: storebuilder
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U storebuilder"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # The test setup creates and drops its own isolated "storebuilder_test" database and refuses any other name.
      DATABASE_URL: postgresql://storebuilder:storebuilder@localhost:5432/storebuilder
      # Throw-away MinIO container for this job only; test-only credentials, isolated "-test"/"-e2e" buckets.
      MINIO_ROOT_USER: ci-test-user
      MINIO_ROOT_PASSWORD: ci-test-secret-0123456789
      TEST_S3_ENDPOINT: http://127.0.0.1:9000
      TEST_S3_ACCESS_KEY_ID: ci-test-user
      TEST_S3_SECRET_ACCESS_KEY: ci-test-secret-0123456789
      # MinIO enforces bucket policies, so the "anonymous users are read-only" checks run here.
      STORAGE_TEST_ENFORCES_POLICY: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - name: Start MinIO (throw-away, test-only credentials)
        run: ./scripts/ci-start-minio.sh
      - name: Storage integration tests (real S3 API)
        run: pnpm test:storage
      - name: MinIO diagnostics (only when the storage tests failed)
        if: failure()
        run: |
          docker ps -a --filter name=minio-ci --format 'table {{.Names}}\t{{.Status}}\t{{.RunningFor}}'
          docker inspect minio-ci --format 'restarts={{.RestartCount}} oom={{.State.OOMKilled}} exit={{.State.ExitCode}} started={{.State.StartedAt}}'
          docker logs --timestamps minio-ci 2>&1 | tail -n 150

  e2e:
    name: E2E tests (Playwright, Chromium)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: storebuilder
          POSTGRES_PASSWORD: storebuilder # throw-away value for this job's own container only
          POSTGRES_DB: storebuilder
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U storebuilder"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # The E2E setup recreates an isolated "storebuilder_e2e" database and refuses any other name.
      DATABASE_URL: postgresql://storebuilder:storebuilder@localhost:5432/storebuilder
      # Throw-away MinIO container for this job only; test-only credentials, isolated "-test"/"-e2e" buckets.
      MINIO_ROOT_USER: ci-test-user
      MINIO_ROOT_PASSWORD: ci-test-secret-0123456789
      TEST_S3_ENDPOINT: http://127.0.0.1:9000
      TEST_S3_ACCESS_KEY_ID: ci-test-user
      TEST_S3_SECRET_ACCESS_KEY: ci-test-secret-0123456789
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - name: Start MinIO (throw-away, test-only credentials)
        run: ./scripts/ci-start-minio.sh
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      # Playwright retries a failed test once in CI (playwright.config.ts). A test that only passes on retry
      # is "flaky" and is reported separately below; it is never counted as a plain pass.
      - name: E2E tests
        run: pnpm test:e2e
      - name: Summarise E2E results (passed vs flaky vs failed)
        if: always()
        run: node scripts/ci-summarize-playwright.mjs playwright-report/results.json
      - name: Upload failure details (traces and report)
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-failure-details
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 7
