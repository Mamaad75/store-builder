# Prometheus configuration (phase 2.6, docs/observability.md). Targets are the compose service names on the internal network.
global:
  scrape_interval: 15s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: api
    static_configs:
      - targets: ["api:9464"]
  - job_name: worker
    static_configs:
      - targets: ["worker:9464"]
