# PRODUCTION STACK (phase 13) - single host: Caddy (TLS edge) -> app -> PostgreSQL, plus a one-shot migrate job, the worker and its queue (Valkey).
# Nothing here is deployed by this repository; phase 14 does that with explicit approval. Object storage is EXTERNAL (S3_* variables).
#
#   docker compose -f docker-compose.prod.yml --env-file .env.production up -d --build
#
# Services: caddy (TLS edge) -> app (Next.js) -> api (NestJS) -> postgres; plus the one-shot migrate job, valkey (queue) and the worker.
# Required variables are listed in .env.production.example; `${VAR:?...}` makes compose refuse to start without them.
# Networks: `backend` has NO route to the outside (internal: true) and holds PostgreSQL; `edge` is the only network Caddy is on.
name: storebuilder

# Web app (Next.js, UI only): no database, no storage credentials, no signing secret. It reaches the API over the internal network and
# builds public image URLs from S3_PUBLIC_BASE_URL (ADR 0001).
x-app-env: &app-env
  NODE_ENV: production
  APP_ROOT_DOMAIN: ${APP_ROOT_DOMAIN:?set APP_ROOT_DOMAIN}
  APP_PROTOCOL: ${APP_PROTOCOL:-https}
  INTERNAL_API_URL: http://api:4000
  TRUST_PROXY_HEADERS: "true"
  TRUSTED_PROXY_HOPS: "1"
  MAIL_TRANSPORT: ${MAIL_TRANSPORT:-none}
  # Used only with MAIL_TRANSPORT=smtp; the server refuses to start if smtp is chosen and these are incomplete (DM2-1).
  SMTP_HOST: ${SMTP_HOST:-}
  SMTP_PORT: ${SMTP_PORT:-587}
  SMTP_SECURE: ${SMTP_SECURE:-}
  SMTP_USER: ${SMTP_USER:-}
  SMTP_PASSWORD: ${SMTP_PASSWORD:-}
  MAIL_FROM: ${MAIL_FROM:-}
  S3_PUBLIC_BASE_URL: ${S3_PUBLIC_BASE_URL:?set S3_PUBLIC_BASE_URL}
  # Phase 2.6 (docs/observability.md): error tracking to a SELF-HOSTED GlitchTip. Empty = off; set but invalid = refuses to start.
  ERROR_TRACKING_DSN: ${ERROR_TRACKING_DSN:-}
  ERROR_TRACKING_ENVIRONMENT: ${ERROR_TRACKING_ENVIRONMENT:-production}
  APP_RELEASE: ${APP_RELEASE:-}

# The NestJS API and everything that touches data: database, object storage, the session-signing secret. Also used by the one-shot
# migrate job and the worker, which run the same code. TRUST_PROXY_HOPS=1: the web app (or Caddy) is the one hop that reports the client address.
x-api-env: &api-env
  NODE_ENV: production
  APP_ROOT_DOMAIN: ${APP_ROOT_DOMAIN:?set APP_ROOT_DOMAIN}
  APP_PROTOCOL: ${APP_PROTOCOL:-https}
  DATABASE_URL: postgresql://${POSTGRES_USER:-storebuilder}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-storebuilder}
  AUTH_SECRET: ${AUTH_SECRET:?set AUTH_SECRET}
  TRUST_PROXY_HOPS: "1"
  RATE_LIMIT_BACKEND: postgres
  S3_ENDPOINT: ${S3_ENDPOINT:?set S3_ENDPOINT}
  S3_REGION: ${S3_REGION:-us-east-1}
  S3_BUCKET: ${S3_BUCKET:?set S3_BUCKET}
  S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?set S3_ACCESS_KEY_ID}
  S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?set S3_SECRET_ACCESS_KEY}
  S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-true}
  S3_PUBLIC_BASE_URL: ${S3_PUBLIC_BASE_URL:?set S3_PUBLIC_BASE_URL}
  # Store secrets (phase 2.4, D24-1): master keys of the envelope encryption. Empty = feature off; half or invalid = the API refuses to start.
  SECRETS_MASTER_KEYS: ${SECRETS_MASTER_KEYS:-}
  SECRETS_ACTIVE_KEY_ID: ${SECRETS_ACTIVE_KEY_ID:-}
  # Phase 2.6: the api and the worker serve Prometheus metrics on this port; Caddy never routes it, only the internal networks reach it
  # (docker-compose.observability.yml). The one-shot migrate job ignores it.
  METRICS_PORT: "9464"
  # Phase 2.6 (docs/observability.md): error tracking to a SELF-HOSTED GlitchTip. Empty = off; set but invalid = refuses to start.
  ERROR_TRACKING_DSN: ${ERROR_TRACKING_DSN:-}
  ERROR_TRACKING_ENVIRONMENT: ${ERROR_TRACKING_ENVIRONMENT:-production}
  APP_RELEASE: ${APP_RELEASE:-}

x-hardening: &hardening
  restart: unless-stopped
  security_opt: ["no-new-privileges:true"]
  cap_drop: [ALL]
  logging:
    driver: json-file
    options: { max-size: "20m", max-file: "5" }

services:
  postgres:
    <<: *hardening
    image: postgres:16-bookworm@sha256:a49f7438ba03589f9b1ca062f2da82e899b48ea1dc50d2449fa09a70be83ebca
    # The official image starts as root to fix volume ownership, then drops to the postgres user: it needs these capabilities back.
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-storebuilder}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-storebuilder}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    shm_size: 256mb

  # Queue of the worker (phase 2.2, docs/async.md): Valkey (BSD, Redis-compatible), self-hosted, on the internal network only.
  # The password comes from the environment (never a literal); AOF keeps queued jobs across restarts; BullMQ requires noeviction.
  # The source of truth for events is PostgreSQL (outbox), so this volume needs no backup.
  valkey:
    <<: *hardening
    image: valkey/valkey:8.1-alpine@sha256:9971099af41c36e887aabdfe22b80c0fe45df949163dfc9cb434febc57cfc3fc
    # The official image starts as root to fix /data ownership, then drops to the valkey user.
    cap_add: [CHOWN, SETGID, SETUID]
    command: ["sh", "-c", "exec valkey-server --appendonly yes --maxmemory 256mb --maxmemory-policy noeviction --requirepass \"$$VALKEY_PASSWORD\""]
    environment:
      VALKEY_PASSWORD: ${VALKEY_PASSWORD:?set VALKEY_PASSWORD}
    volumes:
      - valkeydata:/data
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "valkey-cli --no-auth-warning -a \"$$VALKEY_PASSWORD\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits: { memory: 384m }

  migrate:
    <<: *hardening
    build: { context: ., target: jobs }
    image: storebuilder-jobs:local
    # One-shot job: the shared hardening applies, but it must never be restarted.
    restart: "no"
    command: ["sh", "-c", "pnpm db:deploy && pnpm db:seed"]
    environment: *api-env
    depends_on:
      postgres: { condition: service_healthy }
    networks: [backend]

  api:
    <<: *hardening
    build: { context: ., target: api }
    image: storebuilder-api:local
    environment: *api-env
    depends_on:
      migrate: { condition: service_completed_successfully }
    read_only: true
    tmpfs:
      - /tmp
    # backend (database) + edge (outbound to the external object store, and Caddy's route for the browser's /api/auth, /api/stores and
    # /api/public calls). It publishes no port.
    networks: [backend, edge]
    expose: ["4000", "9464"]
    deploy:
      resources:
        limits: { memory: 768m }

  app:
    <<: *hardening
    build: { context: ., target: runtime }
    image: storebuilder-app:local
    environment: *app-env
    depends_on:
      migrate: { condition: service_completed_successfully }
      api: { condition: service_healthy }
    read_only: true
    tmpfs:
      - /tmp
      - /app/.next/cache
    networks: [backend, edge]
    expose: ["3000"]
    deploy:
      resources:
        limits: { memory: 1g }

  worker:
    <<: *hardening
    build: { context: ., target: jobs }
    image: storebuilder-jobs:local
    # Outbox relay, domain-event consumers and the periodic maintenance jobs (phase 2.2; replaced the scheduler in 2.2b).
    # init: a real PID 1 that forwards SIGTERM and reaps exited job processes. The worker runs through tsx directly (no pnpm
    # wrapper), and each maintenance job runs in its own process group that a timeout kills as a whole (scripts/scheduler-process.ts).
    init: true
    command: ["node_modules/.bin/tsx", "scripts/worker.ts"]
    environment:
      <<: *api-env
      # VALKEY_PASSWORD must be URL-safe (e.g. openssl rand -hex 32): it is embedded in the URL.
      REDIS_URL: redis://:${VALKEY_PASSWORD:?set VALKEY_PASSWORD}@valkey:6379
      # Alerts (Bale, D14-3): only the worker sends them. Both empty = alerts off (logged); half or invalid = refuses to start.
      BALE_BOT_TOKEN: ${BALE_BOT_TOKEN:-}
      BALE_CHAT_ID: ${BALE_CHAT_ID:-}
    expose: ["9464"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      valkey: { condition: service_healthy }
    networks: [backend, edge]
    healthcheck:
      test: ["CMD", "pnpm", "worker:health"]
      interval: 60s
      timeout: 20s
      retries: 3
      start_period: 90s
    deploy:
      resources:
        limits: { memory: 512m }

  caddy:
    <<: *hardening
    build:
      context: docker/caddy
      args:
        DNS_MODULE: ${CADDY_DNS_MODULE:-}
    image: storebuilder-caddy:local
    cap_add: [NET_BIND_SERVICE]
    environment:
      APP_ROOT_DOMAIN: ${APP_ROOT_DOMAIN:?set APP_ROOT_DOMAIN}
      DNS_API_TOKEN: ${DNS_API_TOKEN:-}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
      # Production certificates: the directory holding the provider snippet (see docker/caddy/tls.d/tls-dns.caddy.example).
      - ${CADDY_TLS_DIR:-./docker/caddy/tls.d}:/etc/caddy/tls.d:ro
    depends_on:
      app: { condition: service_healthy }
      api: { condition: service_healthy }
    networks: [edge]

networks:
  backend:
    internal: true
  edge: {}

volumes:
  pgdata:
  valkeydata:
  caddy_data:
  caddy_config:
